<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <title>Login - ToCityBus</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-titulo">
            <p style="font-size:36px">🚌</p>
            <h1>ToCityBus</h1>
            <p>Faça login para continuar</p>
        </div>

        <!-- Área para mensagens de erro (Login inválido, etc ) -->
        <p:messages id="messages" showDetail="false" closable="false">
            <p:autoUpdate />
        </p:messages>

        <!-- O prependId="false" é fundamental para o Spring Security encontrar os campos -->
        <h:form id="loginForm" prependId="false">
            <div class="form-group">
                <label class="form-label">Login</label>
                <p:inputText id="username" value="#{loginBean.login}"
                             styleClass="form-control"
                             placeholder="Seu login"
                             required="true"
                             requiredMessage="Login obrigatório"/>
            </div>
            
            <div class="form-group">
                <label class="form-label">Senha</label>
                <p:password id="password" value="#{loginBean.senha}"
                            styleClass="form-control"
                            placeholder="Sua senha"
                            feedback="false"
                            required="true"
                            requiredMessage="Senha obrigatória"/>
            </div>
            
            <!-- ajax="false" garante que o redirecionamento para a home funcione -->
            <p:commandButton value="Entrar"
                             action="#{loginBean.autenticar}"
                             ajax="false"
                             styleClass="btn btn-primary"
                             style="width:100%;padding:10px"
                             update="@form"/>
        </h:form>
    </div>
</div>
</h:body>
</html>
