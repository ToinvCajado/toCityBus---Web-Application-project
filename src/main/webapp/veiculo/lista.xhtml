<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/template/layout.xhtml">

    <ui:define name="titulo">Veículos - ToCityBus</ui:define>

    <ui:define name="conteudo">
        <p:messages id="msgsOuter" showDetail="true" closable="true" />

        <h:form id="formVeic">
            <div class="page-header">
                <h1 class="page-title">Veículos</h1>
                <p:commandButton value="+ Novo Veículo"
                                 styleClass="btn btn-primary"
                                 action="#{veiculoBean.novoVeiculo}"
                                 update=":formVeiculo"
                                 oncomplete="PF('dlgVeiculo').show()" />
            </div>

            <div class="card">
                <p:dataTable value="#{veiculoBean.veiculos}"
                             var="v"
                             emptyMessage="Nenhum veículo cadastrado.">
                    <p:column headerText="Número">
                        <h:outputText value="#{v.numero}" />
                    </p:column>
                    <p:column headerText="Placa">
                        <h:outputText value="#{v.placa}" />
                    </p:column>
                    <p:column headerText="Modelo">
                        <h:outputText value="#{v.modelo}" />
                    </p:column>
                    <p:column headerText="Motorista">
                        <h:outputText value="#{v.motorista}" />
                    </p:column>
                    <p:column headerText="Poltronas">
                        <h:outputText value="#{v.qtdPoltronas}" />
                    </p:column>
                    <p:column headerText="Ações">
                        <p:commandButton value="Editar"
                                         styleClass="btn btn-cinza btn-sm"
                                         action="#{veiculoBean.prepararEdicao(v)}"
                                         update=":formVeiculo"
                                         oncomplete="PF('dlgVeiculo').show()" />
                        
                        <p:spacer width="5" />
                        
                        <p:commandButton value="Excluir"
                                         styleClass="btn btn-perigo btn-sm"
                                         action="#{veiculoBean.excluir(v)}"
                                         update="@form :msgsOuter"
                                         onclick="return confirm('Excluir o veículo #{v.placa}?')">
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>

        <p:dialog header="Veículo" widgetVar="dlgVeiculo" modal="true" width="600" responsive="true">
            <h:form id="formVeiculo">
                <p:messages id="msgsDlg" showDetail="true" closable="true" />
                
                <div class="form-linha">
                    <div class="form-group">
                        <label class="form-label">Número *</label>
                        <p:inputText value="#{veiculoBean.veiculoSelecionado.numero}"
                                     styleClass="form-control"
                                     required="true"
                                     requiredMessage="Número é obrigatório" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Placa *</label>
                        <p:inputText value="#{veiculoBean.veiculoSelecionado.placa}"
                                     styleClass="form-control"
                                     required="true"
                                     requiredMessage="Placa é obrigatória" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Modelo *</label>
                        <p:inputText value="#{veiculoBean.veiculoSelecionado.modelo}"
                                     styleClass="form-control"
                                     required="true"
                                     requiredMessage="Modelo é obrigatório" />
                    </div>
                </div>

                <div class="form-linha">
                    <div class="form-group">
                        <label class="form-label">Motorista *</label>
                        <p:inputText value="#{veiculoBean.veiculoSelecionado.motorista}"
                                     styleClass="form-control"
                                     required="true"
                                     requiredMessage="Motorista é obrigatório" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Poltronas *</label>
                        <p:inputNumber value="#{veiculoBean.veiculoSelecionado.qtdPoltronas}"
                                       styleClass="form-control"
                                       minValue="1" maxValue="200"
                                       required="true"
                                       requiredMessage="Quantidade de poltronas é obrigatória" />
                    </div>
                </div>

                <div class="form-acoes">
                    <p:commandButton value="Salvar"
                                     styleClass="btn btn-sucesso"
                                     action="#{veiculoBean.salvar}"
                                     update="msgsDlg :formVeic"
                                     oncomplete="if(args &amp;&amp; args.saved) PF('dlgVeiculo').hide()" />
                    
                    <p:commandButton value="Cancelar"
                                     styleClass="btn btn-cinza"
                                     onclick="PF('dlgVeiculo').hide(); return false;" />
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
</html>
